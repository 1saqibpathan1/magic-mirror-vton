name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android local configuration
        working-directory: android-app
        shell: bash
        env:
          MAGICMIRROR_BASE_URL: ${{ vars.MAGICMIRROR_BASE_URL || 'http://10.0.2.2:8000' }}
          MAGICMIRROR_DEVICE_API_KEY: ${{ secrets.MAGICMIRROR_DEVICE_API_KEY || '' }}
        run: |
          printf 'magicMirror.baseUrl=%s\n' "$MAGICMIRROR_BASE_URL" > local.properties
          printf 'magicMirror.deviceApiKey=%s\n' "$MAGICMIRROR_DEVICE_API_KEY" >> local.properties

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-mirror-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
